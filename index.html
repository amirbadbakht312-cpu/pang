<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>تصویر پس‌زمینه کامل و رود عمودی</title>
  <style>
    /* ریست کامل برای پوشش بدون فاصله */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* جلوگیری از اسکرول */
      font-size: 0; /* حذف فضای خالی اینلاین */
    }

    /* کانتینر اصلی که کل صفحه رو می‌پوشونه */
    .fullscreen-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      /* پس‌زمینه کامل */
      background-image: url('assets/image/paszamine.jpeg');
      background-size: cover;        /* پوشش کامل فضا بدون حفظ نسبت (اگه نسبت عکس با صفحه فرق کنه برش می‌خوره) */
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      z-index: 0;
    }

    /* لایه تصویر دوم: عمود مماس بر ضلع بالا و پایین، دقیقاً وسط صفحه */
    .vertical-bar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%); /* مرکزسازی دقیق افقی */
      width: auto;           /* عرض بر اساس ارتفاع تنظیم بشه */
      height: 100vh;         /* ارتفاع دقیقاً برابر با ارتفاع صفحه */
      z-index: 2;           /* بالاتر از پس‌زمینه */
      pointer-events: none; /* اجازه کلیک به لایه زیرین (اختیاری) */
      display: block;
    }

    /* تصویر داخل نوار عمودی */
    .vertical-bar img {
      display: block;
      height: 100%;           /* ارتفاع رو به زور برابر با ارتفاع صفحه می‌کنه */
      width: auto;            /* عرض متناسب با ارتفاع تغییر کنه، ممکنه کشیده یا فشرده بشه */
      object-fit: fill;       /* بی‌کیفیت شدن یا کشیدگی رو می‌پذیریم، دقیقاً اون چیزی که خواستی */
      margin: 0 auto;
      /* حذف border/outline */
      border: none;
      outline: none;
      vertical-align: top;
    }

    /* برای اطمینان از عدم نشون دادن چیزی غیر از این دو عکس */
    .no-content {
      display: none;
    }
  </style>
</head>
<body>
  <!-- پس‌زمینه کامل -->
  <div class="fullscreen-bg" role="img" aria-label="تصویر پس‌زمینه پازمینه"></div>

  <!-- نوار عمودی درست در مرکز، مماس بر بالا و پایین -->
  <div class="vertical-bar">
    <!-- دقت کن مسیر عکس دقیقاً assets/image/roood_1.jpeg هست -->
    <img src="assets/image/roood_1.jpeg" alt="رود عمودی در مرکز" title="roood_1">
  </div>

  <!-- تضمین اینکه اگر تصویر دوم لود نشد، جای خالی نیفته، ولی با height:100% عمودی پر میشه -->
</body>
</html>
