<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>پنگوئن و دریاچه</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    #world {
      position: fixed;
      top: 0; left: 0;
      width: 300vw; height: 200vh;
      background-image: url('assets/image/paszamine.jpeg');
      background-size: 100vw 100vh;
      z-index: 0;
      transition: transform 0.3s ease-out;
    }

    #lake {
      position: absolute;
      left: 150vw; top: 50vh;
      transform: translate(-50%, -50%);
      width: 35vmin; height: 35vmin;
      z-index: 2;
      pointer-events: none;
    }

    #lake img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(0,100,200,0.5);
    }

    #penguin {
      position: fixed;
      z-index: 10;
      width: 60px;
      transition: left 0.4s, top 0.4s;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    #minimap {
      position: fixed;
      top: 15px; right: 15px;
      width: 120px; height: 80px;
      background: rgba(0,0,0,0.7);
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 8px;
      z-index: 100;
    }

    #minimap canvas {
      width: 100%; height: 100%;
    }

    .light {
      position: fixed;
      width: 20px; height: 20px;
      background: #00ff88;
      border-radius: 50%;
      z-index: 9;
      pointer-events: none;
      box-shadow: 0 0 15px #00ff88;
      animation: lightPulse 0.5s ease-out forwards;
      transform: translate(-50%, -50%);
    }

    @keyframes lightPulse {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
    }

    #hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: Tahoma;
      font-size: 13px;
      background: rgba(0,0,0,0.6);
      padding: 8px 18px;
      border-radius: 20px;
      z-index: 200;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="world">
    <div id="lake">
      <img src="assets/image/daryache.jpeg" alt="دریاچه">
    </div>
  </div>

  <img id="penguin" src="assets/image/pangnafasdam.jpeg" alt="پنگوئن">

  <div id="minimap">
    <canvas id="minimap-canvas" width="120" height="80"></canvas>
  </div>

  <div id="hint">🐧 کلیک کن تا پنگوئن بره | دور دریاچه می‌چرخه</div>

  <script>
    // ========== WORLD ==========
    const world = document.getElementById('world');
    let camX = 100, camY = 50; // درصد موقعیت دوربین (وسط دریاچه)

    function updateWorld() {
      const maxX = -200, maxY = -100;
      const x = maxX * (camX / 100);
      const y = maxY * (camY / 100);
      world.style.transform = `translate(${x}vw, ${y}vh)`;
    }

    // ========== LAKE ==========
    const lake = document.getElementById('lake');
    const lakeWorldX = 150; // vw
    const lakeWorldY = 50;  // vh
    const lakeSize = 35;    // vmin

    function getLakeBounds() {
      const margin = 4; // vmin حاشیه امن
      return {
        left: lakeWorldX - lakeSize/2 - margin,
        right: lakeWorldX + lakeSize/2 + margin,
        top: lakeWorldY - lakeSize/2 - margin,
        bottom: lakeWorldY + lakeSize/2 + margin
      };
    }

    function isInsideLake(wx, wy) {
      const b = getLakeBounds();
      return wx >= b.left && wx <= b.right && wy >= b.top && wy <= b.bottom;
    }

    // ========== PENGUIN ==========
    const penguin = document.getElementById('penguin');
    let penguinWorldX = lakeWorldX - 30;
    let penguinWorldY = lakeWorldY;
    let isMoving = false;

    function worldToScreen(wx, wy) {
      return {
        x: (wx + (camX - 100)) * window.innerWidth / 100,
        y: (wy + (camY - 50)) * window.innerHeight / 100
      };
    }

    function updatePenguin() {
      const screen = worldToScreen(penguinWorldX, penguinWorldY);
      penguin.style.left = screen.x + 'px';
      penguin.style.top = screen.y + 'px';
    }

    // ========== MINIMAP ==========
    const minimapCanvas = document.getElementById('minimap-canvas');
    const mmCtx = minimapCanvas.getContext('2d');

    function updateMinimap() {
      const w = 120, h = 80;
      mmCtx.clearRect(0, 0, w, h);

      // پس‌زمینه
      mmCtx.fillStyle = '#1a3a1a';
      mmCtx.fillRect(0, 0, w, h);

      // خطوط تایل
      mmCtx.strokeStyle = 'rgba(255,255,255,0.2)';
      for (let i = 1; i < 3; i++) {
        mmCtx.beginPath();
        mmCtx.moveTo(i * w/3, 0);
        mmCtx.lineTo(i * w/3, h);
        mmCtx.stroke();
      }
      for (let i = 1; i < 2; i++) {
        mmCtx.beginPath();
        mmCtx.moveTo(0, i * h/2);
        mmCtx.lineTo(w, i * h/2);
        mmCtx.stroke();
      }

      // دریاچه
      const lx = (lakeWorldX / 300) * w;
      const ly = (lakeWorldY / 100) * h;
      const lr = (lakeSize / 2 / 100) * h;
      mmCtx.fillStyle = 'rgba(0,150,255,0.6)';
      mmCtx.beginPath();
      mmCtx.arc(lx, ly, lr, 0, Math.PI*2);
      mmCtx.fill();

      // پنگوئن
      const px = (penguinWorldX / 300) * w;
      const py = (penguinWorldY / 100) * h;
      mmCtx.fillStyle = '#00ff88';
      mmCtx.beginPath();
      mmCtx.arc(px, py, 3, 0, Math.PI*2);
      mmCtx.fill();
      mmCtx.strokeStyle = '#fff';
      mmCtx.lineWidth = 1;
      mmCtx.stroke();

      // دوربین
      mmCtx.strokeStyle = 'rgba(255,255,255,0.8)';
      mmCtx.lineWidth = 1.5;
      mmCtx.strokeRect((camX - 100) * w/300 + w/6, (camY - 50) * h/100 + h/4, w/3, h/2);
    }

    // ========== CAMERA ==========
    function moveCameraTo(wx, wy) {
      camX = Math.max(16.6, Math.min(283.3, wx));
      camY = Math.max(25, Math.min(75, wy));
      updateWorld();
      updatePenguin();
      updateMinimap();
    }

    // ========== PATHFINDING ==========
    function lineIntersectsLake(x1, y1, x2, y2) {
      for (let i = 0; i <= 20; i++) {
        const t = i / 20;
        if (isInsideLake(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t)) return true;
      }
      return false;
    }

    function findPath(startX, startY, endX, endY) {
      if (!isInsideLake(startX, startY) && !isInsideLake(endX, endY) && 
          !lineIntersectsLake(startX, startY, endX, endY)) {
        return [{ x: endX, y: endY }];
      }

      const b = getLakeBounds();
      const corners = [
        { x: b.left, y: b.top },
        { x: b.right, y: b.top },
        { x: b.right, y: b.bottom },
        { x: b.left, y: b.bottom }
      ];

      function nearest(x, y) {
        let min = Infinity, best = corners[0];
        corners.forEach(c => {
          const d = Math.hypot(c.x - x, c.y - y);
          if (d < min) { min = d; best = c; }
        });
        return best;
      }

      let startPt = isInsideLake(startX, startY) ? nearest(startX, startY) : { x: startX, y: startY };
      let endPt = isInsideLake(endX, endY) ? nearest(endX, endY) : { x: endX, y: endY };

      if (!isInsideLake(startX, startY) && lineIntersectsLake(startX, startY, endPt.x, endPt.y)) {
        startPt = nearest(startX, startY);
      }

      const idx1 = corners.findIndex(c => c.x === startPt.x && c.y === startPt.y);
      const idx2 = corners.findIndex(c => c.x === endPt.x && c.y === endPt.y);

      const path = [startPt];
      if (idx1 !== -1 && idx2 !== -1 && idx1 !== idx2) {
        const p1 = [], p2 = [];
        for (let i = idx1; i !== idx2; i = (i + 1) % 4) p1.push(corners[i]);
        p1.push(corners[idx2]);
        for (let i = idx1; i !== idx2; i = (i - 1 + 4) % 4) p2.push(corners[i]);
        p2.push(corners[idx2]);
        path.push(...(p1.length <= p2.length ? p1 : p2));
      }
      if (endPt.x !== endX || endPt.y !== endY) path.push({ x: endX, y: endY });

      return path;
    }

    // ========== LIGHT ==========
    function createLight(wx, wy) {
      const screen = worldToScreen(wx, wy);
      const light = document.createElement('div');
      light.className = 'light';
      light.style.left = screen.x + 'px';
      light.style.top = screen.y + 'px';
      document.body.appendChild(light);
      setTimeout(() => light.remove(), 500);
    }

    // ========== MOVEMENT ==========
    async function movePlayerTo(tx, ty) {
      if (isMoving) return;
      const path = findPath(penguinWorldX, penguinWorldY, tx, ty);
      if (path.length === 0) return;

      isMoving = true;
      for (const p of path) {
        penguinWorldX = p.x;
        penguinWorldY = p.y;
        moveCameraTo(p.x, p.y);
        await new Promise(r => setTimeout(r, 150));
      }
      isMoving = false;
      createLight(path[path.length-1].x, path[path.length-1].y);
    }

    // ========== CLICK ==========
    document.addEventListener('click', (e) => {
      if (isMoving) return;
      const wx = (e.clientX / window.innerWidth) * 100 - (camX - 100);
      const wy = (e.clientY / window.innerHeight) * 100 - (camY - 50);
      const tx = Math.max(2, Math.min(298, wx));
      const ty = Math.max(2, Math.min(98, wy));
      movePlayerTo(tx, ty);
    });

    // ========== INIT ==========
    moveCameraTo(penguinWorldX, penguinWorldY);
    updateMinimap();

    // ========== RESIZE ==========
    window.addEventListener('resize', () => {
      updateWorld();
      updatePenguin();
      updateMinimap();
    });
  </script>

</body>
</html>
