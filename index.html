<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>پنگوئن کنار دریاچه</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-size: 0;
      cursor: crosshair;
    }

    /* پس‌زمینه کامل */
    .fullscreen-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('assets/image/paszamine.jpeg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      z-index: 0;
    }

    /* نوار دریاچه عمودی با عرض یک‌دوم */
    .vertical-bar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100vw / 2);
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .vertical-bar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      border: none;
      outline: none;
      vertical-align: top;
      flex-shrink: 0;
    }

    /* پنگوئن */
    #penguin {
      position: fixed;
      z-index: 10;
      width: 80px;
      height: auto;
      transition: left 0.8s ease-in-out, top 0.8s ease-in-out;
      pointer-events: none;
      image-rendering: auto;
    }

    /* نور سبز کوچیک */
    .green-light {
      position: fixed;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, #00ff88 0%, #00cc66 40%, transparent 70%);
      border-radius: 50%;
      z-index: 9;
      pointer-events: none;
      box-shadow: 0 0 15px #00ff88, 0 0 30px #00ff66;
      animation: pulse 0.8s ease-in-out;
      transform: translate(-50%, -50%);
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
    }

    /* لایه کلیک‌گیر */
    #click-catcher {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 20;
      background: transparent;
    }

    /* راهنما */
    .hint {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 30;
      color: rgba(255, 255, 255, 0.7);
      font-family: 'Vazirmatn', 'Tahoma', sans-serif;
      font-size: 13px;
      background: rgba(0,0,0,0.5);
      padding: 6px 14px;
      border-radius: 20px;
      pointer-events: none;
      direction: rtl;
    }
  </style>
</head>
<body>
  <!-- پس‌زمینه -->
  <div class="fullscreen-bg" role="img" aria-label="پس‌زمینه"></div>

  <!-- دریاچه عمودی -->
  <div class="vertical-bar" id="lake">
    <img src="assets/image/daryache.jpeg" alt="دریاچه">
  </div>

  <!-- پنگوئن -->
  <img id="penguin" src="assets/image/pangnafasdam.jpeg" alt="پنگوئن نفس‌دام">

  <!-- لایه کلیک -->
  <div id="click-catcher"></div>

  <!-- راهنما -->
  <div class="hint">پنگوئن وارد دریاچه نمیشه! نزدیکش کلیک کن</div>

  <script>
    (function() {
      'use strict';

      const penguin = document.getElementById('penguin');
      const lake = document.getElementById('lake');
      const clickCatcher = document.getElementById('click-catcher');

      // موقعیت اولیه پنگوئن (سمت چپ، خارج از دریاچه)
      let penguinX = window.innerWidth * 0.1;
      let penguinY = window.innerHeight * 0.5;
      
      // قرار دادن اولیه
      penguin.style.left = penguinX + 'px';
      penguin.style.top = penguinY + 'px';
      penguin.style.transform = 'translate(-50%, -50%)';

      // فاصله ایمن از لبه دریاچه (پیکسل)
      const SAFE_DISTANCE = 50;

      // تابع تشخیص محدوده دریاچه
      function getLakeBounds() {
        const lakeRect = lake.getBoundingClientRect();
        return {
          left: lakeRect.left,
          right: lakeRect.right,
          top: lakeRect.top,
          bottom: lakeRect.bottom
        };
      }

      // تابع بررسی اینکه نقطه داخل دریاچه هست یا نه
      function isInsideLake(x, y) {
        const bounds = getLakeBounds();
        return x >= bounds.left && x <= bounds.right && 
               y >= bounds.top && y <= bounds.bottom;
      }

      // تابع پیدا کردن نزدیک‌ترین نقطه امن بیرون دریاچه
      function findSafeSpot(targetX, targetY) {
        const bounds = getLakeBounds();
        
        // اگر نقطه خارج دریاچه هست، همون رو برمی‌گردونیم
        if (!isInsideLake(targetX, targetY)) {
          return { x: targetX, y: targetY };
        }

        // پیدا کردن نزدیک‌ترین لبه دریاچه
        const distToLeft = targetX - bounds.left;
        const distToRight = bounds.right - targetX;
        const distToTop = targetY - bounds.top;
        const distToBottom = bounds.bottom - targetY;

        const minDist = Math.min(distToLeft, distToRight, distToTop, distToBottom);

        let safeX = targetX;
        let safeY = targetY;

        if (minDist === distToLeft) {
          safeX = bounds.left - SAFE_DISTANCE;
        } else if (minDist === distToRight) {
          safeX = bounds.right + SAFE_DISTANCE;
        } else if (minDist === distToTop) {
          safeY = bounds.top - SAFE_DISTANCE;
        } else {
          safeY = bounds.bottom + SAFE_DISTANCE;
        }

        // محدود کردن به داخل صفحه
        const margin = 40;
        safeX = Math.min(Math.max(safeX, margin), window.innerWidth - margin);
        safeY = Math.min(Math.max(safeY, margin), window.innerHeight - margin);

        return { x: safeX, y: safeY };
      }

      // تابع ساخت نور سبز
      function createGreenLight(x, y) {
        const light = document.createElement('div');
        light.className = 'green-light';
        light.style.left = x + 'px';
        light.style.top = y + 'px';
        document.body.appendChild(light);

        setTimeout(() => {
          if (light && light.parentNode) {
            light.parentNode.removeChild(light);
          }
        }, 800);
      }

      // تابع حرکت پنگوئن
      function movePenguinTo(clientX, clientY) {
        const margin = 40;
        let targetX = Math.min(Math.max(clientX, margin), window.innerWidth - margin);
        let targetY = Math.min(Math.max(clientY, margin), window.innerHeight - margin);

        // پیدا کردن نقطه امن (اگر داخل دریاچه کلیک شده باشه، نزدیک‌ترین نقطه بیرون)
        const safeSpot = findSafeSpot(targetX, targetY);
        
        // به‌روزرسانی موقعیت پنگوئن
        penguinX = safeSpot.x;
        penguinY = safeSpot.y;

        // اعمال حرکت
        penguin.style.left = safeSpot.x + 'px';
        penguin.style.top = safeSpot.y + 'px';
        penguin.style.transform = 'translate(-50%, -50%)';

        // نور سبز در نقطه امن (نه نقطه کلیک اگر داخل دریاچه بوده)
        createGreenLight(safeSpot.x, safeSpot.y);
      }

      // مدیریت کلیک
      clickCatcher.addEventListener('click', function(e) {
        e.stopPropagation();
        const clickX = e.clientX;
        const clickY = e.clientY;

        // حرکت پنگوئن (حتی اگر روی دریاچه کلیک بشه، میره نزدیک‌ترین نقطه امن)
        movePenguinTo(clickX, clickY);
      });

      // هندل تغییر سایز صفحه
      window.addEventListener('resize', function() {
        const ratioX = penguinX / window.innerWidth;
        const ratioY = penguinY / window.innerHeight;
        
        penguinX = ratioX * window.innerWidth;
        penguinY = ratioY * window.innerHeight;
        
        penguinX = Math.min(Math.max(penguinX, 40), window.innerWidth - 40);
        penguinY = Math.min(Math.max(penguinY, 40), window.innerHeight - 40);
        
        // اگر بعد از resize داخل دریاچه افتاد، ببرش بیرون
        if (isInsideLake(penguinX, penguinY)) {
          const safeSpot = findSafeSpot(penguinX, penguinY);
          penguinX = safeSpot.x;
          penguinY = safeSpot.y;
        }
        
        penguin.style.left = penguinX + 'px';
        penguin.style.top = penguinY + 'px';
        penguin.style.transform = 'translate(-50%, -50%)';
      });

      // لود اولیه تصویر
      penguin.addEventListener('load', function() {
        penguin.style.left = penguinX + 'px';
        penguin.style.top = penguinY + 'px';
        penguin.style.transform = 'translate(-50%, -50%)';
      });

      if (penguin.complete) {
        penguin.style.left = penguinX + 'px';
        penguin.style.top = penguinY + 'px';
        penguin.style.transform = 'translate(-50%, -50%)';
      }

      console.log('🐧 پنگوئن کنار دریاچه آماده‌ست! وارد آب نمیشه');
    })();
  </script>
</body>
</html>
