<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>پنگوئن و دریاچه - ایزومتریک</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
    }

    /* صحنه اصلی با پرسپکتیو ایزومتریک */
    .scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      perspective: 1000px;
      overflow: hidden;
    }

    .ground {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120vw;
      height: 120vh;
      transform: rotateX(45deg) translate(-50%, -50%);
      transform-style: preserve-3d;
      background-image: url('assets/image/paszamine.jpeg');
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    /* دریاچه کوچک‌تر - حدود ۲۵٪ عرض صفحه */
    .lake-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 25vw;
      height: 60vh;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      border-radius: 40% 60% 55% 45% / 45% 50% 50% 55%;
      box-shadow: 0 0 30px rgba(0, 100, 200, 0.4), inset 0 0 20px rgba(0, 150, 255, 0.2);
    }

    .lake-container img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.9) saturate(1.2);
    }

    /* بازتاب آب */
    .lake-reflection {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 25vw;
      height: 60vh;
      z-index: 1;
      pointer-events: none;
      border-radius: 40% 60% 55% 45% / 45% 50% 50% 55%;
      background: linear-gradient(45deg, 
        rgba(0, 150, 255, 0.1) 0%, 
        rgba(0, 200, 255, 0.05) 50%, 
        rgba(0, 100, 200, 0.1) 100%);
      animation: waterShimmer 3s ease-in-out infinite;
    }

    @keyframes waterShimmer {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }

    /* پنگوئن */
    #penguin {
      position: fixed;
      z-index: 10;
      width: 60px;
      height: auto;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      transform: translate(-50%, -50%);
      filter: drop-shadow(3px 5px 4px rgba(0,0,0,0.5));
    }

    /* نور سبز */
    .green-light {
      position: fixed;
      width: 24px;
      height: 24px;
      background: radial-gradient(circle, #00ff88 0%, #00cc66 30%, transparent 70%);
      border-radius: 50%;
      z-index: 9;
      pointer-events: none;
      box-shadow: 0 0 20px #00ff88, 0 0 40px #00ff66, 0 0 60px rgba(0,255,100,0.5);
      animation: pulse 0.6s ease-out;
      transform: translate(-50%, -50%);
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
      40% { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    }

    /* لایه کلیک */
    #click-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 100;
      cursor: crosshair;
      background: transparent;
    }

    /* راهنما */
    .hint {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      color: rgba(255, 255, 255, 0.8);
      font-family: 'Vazirmatn', 'Tahoma', sans-serif;
      font-size: 14px;
      background: rgba(0,0,0,0.6);
      padding: 8px 20px;
      border-radius: 25px;
      pointer-events: none;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      direction: rtl;
    }

    /* ذرات معلق */
    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 5;
      animation: float 2s ease-out forwards;
    }

    @keyframes float {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-30px) scale(0); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="ground"></div>
  </div>

  <div class="lake-container">
    <img src="assets/image/daryache.jpeg" alt="دریاچه">
  </div>
  <div class="lake-reflection"></div>

  <img id="penguin" src="assets/image/pangnafasdam.jpeg" alt="پنگوئن">

  <div id="click-layer"></div>
  <div class="hint">🐧 پنگوئن مسیر امن رو پیدا می‌کنه - دور دریاچه می‌چرخه</div>

  <script>
    (function() {
      'use strict';

      const penguin = document.getElementById('penguin');
      const clickLayer = document.getElementById('click-layer');
      
      // ابعاد دریاچه (۲۵٪ عرض و ۶۰٪ ارتفاع)
      const LAKE_WIDTH_PERCENT = 25;
      const LAKE_HEIGHT_PERCENT = 60;
      const SAFE_MARGIN = 30; // فاصله امن از لبه دریاچه

      // موقعیت فعلی پنگوئن
      let currentX = window.innerWidth * 0.15;
      let currentY = window.innerHeight * 0.5;
      
      // مسیر حرکت
      let isMoving = false;
      let animationQueue = [];

      // تنظیم موقعیت اولیه
      penguin.style.left = currentX + 'px';
      penguin.style.top = currentY + 'px';

      // محاسبه محدوده دریاچه
      function getLakeBounds() {
        const lakeWidth = (window.innerWidth * LAKE_WIDTH_PERCENT) / 100;
        const lakeHeight = (window.innerHeight * LAKE_HEIGHT_PERCENT) / 100;
        const lakeLeft = (window.innerWidth - lakeWidth) / 2;
        const lakeTop = (window.innerHeight - lakeHeight) / 2;
        
        return {
          left: lakeLeft - SAFE_MARGIN,
          right: lakeLeft + lakeWidth + SAFE_MARGIN,
          top: lakeTop - SAFE_MARGIN,
          bottom: lakeTop + lakeHeight + SAFE_MARGIN,
          centerX: lakeLeft + lakeWidth / 2,
          centerY: lakeTop + lakeHeight / 2,
          width: lakeWidth + SAFE_MARGIN * 2,
          height: lakeHeight + SAFE_MARGIN * 2
        };
      }

      // بررسی اینکه نقطه داخل محدوده ممنوعه هست یا نه
      function isInsideLake(x, y) {
        const bounds = getLakeBounds();
        return x >= bounds.left && x <= bounds.right && 
               y >= bounds.top && y <= bounds.bottom;
      }

      // پیدا کردن مسیر امن با الگوریتم A* ساده
      function findPath(startX, startY, endX, endY) {
        const bounds = getLakeBounds();
        const waypoints = [];
        
        // اگر هر دو نقطه خارج دریاچه باشن و خط مستقیم از دریاچه عبور نکنه
        if (!isInsideLake(startX, startY) && !isInsideLake(endX, endY)) {
          if (!lineIntersectsLake(startX, startY, endX, endY)) {
            return [{ x: endX, y: endY }];
          }
        }

        // نقاط کلیدی اطراف دریاچه (۴ گوشه + وسط اضلاع)
        const corners = [
          { x: bounds.left, y: bounds.top },
          { x: bounds.right, y: bounds.top },
          { x: bounds.left, y: bounds.bottom },
          { x: bounds.right, y: bounds.bottom },
          { x: bounds.left, y: bounds.centerY },
          { x: bounds.right, y: bounds.centerY },
          { x: bounds.centerX, y: bounds.top },
          { x: bounds.centerX, y: bounds.bottom }
        ];

        // پیدا کردن نزدیک‌ترین نقطه امن به مبدا
        let startCorner = findNearestSafePoint(startX, startY, corners);
        // پیدا کردن نزدیک‌ترین نقطه امن به مقصد
        let endCorner = findNearestSafePoint(endX, endY, corners);

        if (startCorner && endCorner) {
          // اگر نقطه شروع و پایان یکسان باشن
          if (startCorner.x === endCorner.x && startCorner.y === endCorner.y) {
            return [{ x: endCorner.x, y: endCorner.y }];
          }

          // مسیر از مبدا به گوشه اول
          waypoints.push({ x: startCorner.x, y: startCorner.y });
          
          // مسیر دور دریاچه
          const perimeterPath = getPerimeterPath(startCorner, endCorner, bounds);
          waypoints.push(...perimeterPath);
          
          // مسیر از گوشه آخر به مقصد
          waypoints.push({ x: endX, y: endY });
        } else {
          // fallback: مستقیم برو (نباید اتفاق بیفته)
          waypoints.push({ x: endX, y: endY });
        }

        return waypoints;
      }

      // بررسی تقاطع خط با دریاچه
      function lineIntersectsLake(x1, y1, x2, y2) {
        const bounds = getLakeBounds();
        const steps = 20;
        
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const x = x1 + (x2 - x1) * t;
          const y = y1 + (y2 - y1) * t;
          
          if (isInsideLake(x, y)) {
            return true;
          }
        }
        return false;
      }

      // پیدا کردن نزدیک‌ترین نقطه امن
      function findNearestSafePoint(x, y, points) {
        let minDist = Infinity;
        let nearest = null;
        
        for (const point of points) {
          const dist = Math.hypot(point.x - x, point.y - y);
          if (dist < minDist && !isInsideLake(point.x, point.y)) {
            minDist = dist;
            nearest = point;
          }
        }
        
        return nearest;
      }

      // مسیر دور دریاچه روی محیط
      function getPerimeterPath(start, end, bounds) {
        const perimeterPoints = [
          { x: bounds.left, y: bounds.top },
          { x: bounds.centerX, y: bounds.top },
          { x: bounds.right, y: bounds.top },
          { x: bounds.right, y: bounds.centerY },
          { x: bounds.right, y: bounds.bottom },
          { x: bounds.centerX, y: bounds.bottom },
          { x: bounds.left, y: bounds.bottom },
          { x: bounds.left, y: bounds.centerY }
        ];

        // پیدا کردن ایندکس نقطه شروع و پایان روی محیط
        let startIdx = -1, endIdx = -1;
        let minStartDist = Infinity, minEndDist = Infinity;

        for (let i = 0; i < perimeterPoints.length; i++) {
          const distToStart = Math.hypot(perimeterPoints[i].x - start.x, perimeterPoints[i].y - start.y);
          const distToEnd = Math.hypot(perimeterPoints[i].x - end.x, perimeterPoints[i].y - end.y);
          
          if (distToStart < minStartDist) {
            minStartDist = distToStart;
            startIdx = i;
          }
          if (distToEnd < minEndDist) {
            minEndDist = distToEnd;
            endIdx = i;
          }
        }

        // انتخاب کوتاه‌ترین مسیر روی محیط (جهت عقربه یا خلاف)
        const path1 = [];
        const path2 = [];
        
        // مسیر در جهت عقربه‌های ساعت
        let idx = startIdx;
        while (idx !== endIdx) {
          path1.push(perimeterPoints[idx]);
          idx = (idx + 1) % perimeterPoints.length;
        }
        path1.push(perimeterPoints[endIdx]);
        
        // مسیر خلاف عقربه‌های ساعت
        idx = startIdx;
        while (idx !== endIdx) {
          path2.push(perimeterPoints[idx]);
          idx = (idx - 1 + perimeterPoints.length) % perimeterPoints.length;
        }
        path2.push(perimeterPoints[endIdx]);

        // انتخاب مسیر کوتاه‌تر
        return path1.length <= path2.length ? path1 : path2;
      }

      // ایجاد نور سبز
      function createGreenLight(x, y) {
        const light = document.createElement('div');
        light.className = 'green-light';
        light.style.left = x + 'px';
        light.style.top = y + 'px';
        document.body.appendChild(light);
        
        // ذرات اضافی
        for (let i = 0; i < 3; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle';
          particle.style.left = (x + (Math.random() - 0.5) * 30) + 'px';
          particle.style.top = (y + (Math.random() - 0.5) * 30) + 'px';
          particle.style.width = '4px';
          particle.style.height = '4px';
          particle.style.background = '#00ff88';
          particle.style.borderRadius = '50%';
          document.body.appendChild(particle);
          
          setTimeout(() => particle.remove(), 2000);
        }

        setTimeout(() => light.remove(), 600);
      }

      // حرکت پنگوئن در طول مسیر
      async function moveAlongPath(waypoints) {
        if (waypoints.length === 0) return;
        
        isMoving = true;
        
        for (const point of waypoints) {
          if (!isMoving) break;
          
          currentX = point.x;
          currentY = point.y;
          
          penguin.style.left = point.x + 'px';
          penguin.style.top = point.y + 'px';
          
          // چرخش پنگوئن به سمت حرکت
          const dx = point.x - parseFloat(penguin.style.left || currentX);
          if (Math.abs(dx) > 1) {
            penguin.style.transform = `translate(-50%, -50%) scaleX(${dx > 0 ? 1 : -1})`;
          }
          
          await new Promise(resolve => setTimeout(resolve, 300));
        }
        
        isMoving = false;
        
        // نور سبز در مقصد نهایی
        const lastPoint = waypoints[waypoints.length - 1];
        createGreenLight(lastPoint.x, lastPoint.y);
      }

      // کلیک روی صفحه
      clickLayer.addEventListener('click', function(e) {
        if (isMoving) return; // اگر در حال حرکته، کلیک جدید قبول نکن
        
        const targetX = e.clientX;
        const targetY = e.clientY;
        
        // محدود کردن به صفحه
        const margin = 30;
        const clampedX = Math.min(Math.max(targetX, margin), window.innerWidth - margin);
        const clampedY = Math.min(Math.max(targetY, margin), window.innerHeight - margin);
        
        // اگر مقصد داخل دریاچه هست، به نزدیک‌ترین نقطه امن ببر
        let finalTarget = { x: clampedX, y: clampedY };
        if (isInsideLake(clampedX, clampedY)) {
          const bounds = getLakeBounds();
          const corners = [
            { x: bounds.left, y: bounds.top },
            { x: bounds.right, y: bounds.top },
            { x: bounds.left, y: bounds.bottom },
            { x: bounds.right, y: bounds.bottom }
          ];
          finalTarget = findNearestSafePoint(clampedX, clampedY, corners) || finalTarget;
        }
        
        // پیدا کردن مسیر
        const path = findPath(currentX, currentY, finalTarget.x, finalTarget.y);
        
        // حرکت
        moveAlongPath(path);
      });

      // آپدیت موقعیت با تغییر سایز
      window.addEventListener('resize', () => {
        const ratioX = currentX / window.innerWidth;
        const ratioY = currentY / window.innerHeight;
        
        currentX = ratioX * window.innerWidth;
        currentY = ratioY * window.innerHeight;
        
        penguin.style.left = currentX + 'px';
        penguin.style.top = currentY + 'px';
      });

      console.log('🐧 مسیریاب پنگوئن فعال شد - دور دریاچه می‌چرخه');
    })();
  </script>
</body>
</html>
